name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Tag builds are stamped with the tag (v1.2.3 -> 1.2.3); other builds
      # get a dev version that identifies the commit.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Each platform ships as an archive holding the program plus license
      # files: .zip for Windows (a bare .exe download tends to be flagged by
      # browsers and security software), .tar.gz for macOS so the executable
      # bit survives the download.
      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="dingtalk-agent-${GOOS}-${GOARCH}"
          bin="dingtalk-agent"
          if [[ "$GOOS" == "windows" ]]; then bin="dingtalk-agent.exe"; fi
          mkdir -p dist "build/${name}"
          ldflags="-s -w -X main.version=${VERSION}"
          # GUI subsystem: double-clicking opens the window without a console
          # flashing up; terminal use attaches to the console (desktop.Prepare).
          if [[ "$GOOS" == "windows" ]]; then ldflags="$ldflags -H windowsgui"; fi
          go build -trimpath -ldflags "$ldflags" -o "build/${name}/${bin}" .
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "build/${name}/"
          if [[ "$GOOS" == "windows" ]]; then
            (cd build && zip -r -9 "../dist/${name}.zip" "${name}")
          else
            tar -C build -czf "dist/${name}.tar.gz" "${name}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: dingtalk-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
