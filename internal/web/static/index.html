<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钉钉助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23007FFF'/%3E%3Cpath d='M9 11.5c4.6 1.6 9.8 2 14.5 1.1-1 2.3-2.6 4.1-4.6 5.3l2.2 3.1h-3.3l-3.6 4.6.9-4H11l3-3.3c-2.4-1.6-4.2-4-5-6.8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="rail-avatar" id="meAvatar" title="">我</div>
    <a class="rail-item" data-route="chat" href="#/chat"><span class="rail-icon" data-icon="chat"></span><span>消息</span></a>
    <a class="rail-item" data-route="report" href="#/report"><span class="rail-icon" data-icon="dashboard"></span><span>工作台</span></a>
    <a class="rail-item" data-route="todos" href="#/todos"><span class="rail-icon" data-icon="todo"></span><span>待办</span><i class="rail-badge" id="todoBadge" hidden></i></a>
    <a class="rail-item" data-route="calendar" href="#/calendar"><span class="rail-icon" data-icon="calendar"></span><span>日程</span></a>
    <a class="rail-item" data-route="search" href="#/search"><span class="rail-icon" data-icon="search"></span><span>搜索</span></a>
    <a class="rail-item" data-route="exports" href="#/exports"><span class="rail-icon" data-icon="download"></span><span>导出</span></a>
    <div class="rail-spacer"></div>
    <button class="rail-item rail-sync" id="syncBtn" title="同步最新数据"><span class="rail-icon" data-icon="sync"></span><span id="syncLabel">同步</span></button>
    <button class="rail-item" id="themeBtn" title="切换深色/浅色"><span class="rail-icon" data-icon="theme"></span><span>主题</span></button>
    <a class="rail-item" data-route="settings" href="#/settings" title="设置"><span class="rail-icon" data-icon="gear"></span><span>设置</span></a>
  </nav>
  <main class="view" id="view"></main>
</div>
<div class="viewer" id="viewer" hidden>
  <div class="viewer-stage" id="vStage"><img id="vImg" alt="" draggable="false"></div>
  <button class="viewer-nav prev" id="vPrev" title="上一张 (←)"></button>
  <button class="viewer-nav next" id="vNext" title="下一张 (→)"></button>
  <div class="viewer-top"><span id="vCount"></span><span class="viewer-tip" id="vTip"></span><button class="viewer-close" id="vClose" title="关闭 (Esc)">✕</button></div>
  <div class="viewer-bar">
    <button id="vOut" title="缩小 (-)">−</button>
    <span id="vPct">100%</span>
    <button id="vIn" title="放大 (+)">+</button>
    <i></i>
    <button id="vFit" title="适应窗口">适应</button>
    <button id="v11" title="原始大小 (0)">1:1</button>
    <i></i>
    <a id="vOpen" target="_blank" title="新窗口打开原图">打开原图</a>
    <a id="vDown" download title="下载">下载</a>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
